version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: '00:00'
      timezone: Etc/UTC
    groups:
      maven:
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: '00:00'
      timezone: Etc/UTC
    groups:
      github-actions:
        patterns:
          - '*'
